name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Sin `version`: usa el campo "packageManager" del package.json (pnpm 10.x),
        # así el install respeta el lockfile generado localmente.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Start MongoDB (replica set)
        # Los tests usan transacciones → requieren un replica set.
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: "7"
          mongodb-replica-set: rs0

      - name: Run tests
        run: pnpm test:run
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/product-api?replicaSet=rs0
          TOKEN_SECRET: ci-test-secret-not-used-in-prod
          CLIENT_URLS: http://localhost:3000
          # Cloudinary: la validación de env las exige; en tests se mockea el SDK.
          CLOUDINARY_CLOUD_NAME: ci
          CLOUDINARY_API_KEY: ci
          CLOUDINARY_API_SECRET: ci

      - name: Build app
        run: pnpm build

      - name: Build Docker image
        run: docker build -t app-test .
